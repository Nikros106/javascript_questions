<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function enter_number(){
            var i=1,j;
            var a=""
            while(i<=5){
                  j=1;
                while(j<=i){
                    if(j%2==0){
                        a+="#"
                    }
                    else{
                        a+="*"
                    }
                    j++;
                }
                a+= "\n"
                i++
            } 
            console.log(a)

        }
        
    </script>
</head>
<body>
    <button onclick="enter_number()">5star</button>
    
</body>
</html>
