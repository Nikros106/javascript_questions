    <Script>
        function print(){
            var newone = [1,2,4,5,6,7]

        }
      function print_rev(){
    var rev = [1,2,3,4,5,6]

    while(i >= 0){                 
        console.log(rev[i])
        i--                         
    }
}
function evenn(){
    var even = [1,2,3,4,5,6]
    var i = 0
    while(i<=5){
    if(even[i]%2==0){
        console.log(even[i])
    }
    i++
}
}
function oddd(){
    var odd = [1,2,3,4,5,6]
    var i = 0
    while(i<=5){
    if(odd[i]%2==1){
        console.log(odd[i])
    }
    i++
}
}
function addd(){
    var add = [1,2,3,4,5,6]
    var i = 0,ans=0
    while(i<=5){
     ans=ans+add[i]
     
    i++
}
        console.log("the sum is ",ans)

}
function two_Array(){
    var arr1 = [1,2,3,4,5,6]
    var arr2 = [1,2,3,4,5,6]
    var i = 0,ans=0
    while(i<=5){
     ans= ans+arr1[i]+arr2[i]
     
    i++
}
        console.log("the sum of 2 arr is ",ans)

}
function two_Array_swap(){
    var arr1 = [1,2,3,4,5,6]
    var arr2 = [7,8,9,10,10,11]
    var i = 0, a=0,b=0,c=0, d=0,temp=[];
       while(i<=5){
        console.log("befor value swap arr1=",arr1[i])
        i++
       }
       while(a<=5){
      
        console.log("befor value swap arr2=",arr2[a])
        a++
       }
    while(b<=5){

    temp[b]= arr1[b];
    arr1[b]= arr2[b];
    arr2[b]= temp[b];
     
     
    b++
}
 while(c<=5){
        console.log("after value swap arr1=",arr1[c])
        c++
       }
 while(d<=5){
        console.log("after value swap arr2=",arr2[d])
        d++
       }
        

}
function max(){
    var arr = [1,2,3,4,5,6]
    var i = 0,maxx= 0
    while(i<=5){
      if(maxx<arr[i]) {
        maxx=arr[i]
      }
      
     
    i++
}
        console.log("max=",maxx)

         

}
